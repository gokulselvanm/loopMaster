<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Paste a YouTube link and loop it forever.">
  <title>loop.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080808'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23ff4438'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="home" id="home">
      <div class="home-inner">
        <h1 class="brand">loop<span>.</span></h1>

        <form id="loop-form" novalidate>
          <div class="input-wrap" id="input-wrap">
            <label class="sr-only" for="youtube-url">YouTube link</label>
            <input
              id="youtube-url"
              name="url"
              type="text"
              placeholder="Paste a YouTube link"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            >
            <button type="submit" class="loop-button">Loop</button>
          </div>
          <p class="hint" id="hint" aria-live="polite">One link, or a few. They’ll play on repeat.</p>
        </form>
      </div>
    </section>

    <section class="player" id="player" aria-label="Video player" hidden>
      <iframe
        id="video"
        title="YouTube video player"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <button class="new-link" id="new-link" type="button">New link</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
